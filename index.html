<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti, Mary</title>
    <style>
        body {
            margin: 0;
            background-color: #0B132B;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 750px;
            width: 100%;
        }
        canvas {
            background-color: #1C2541;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-radius: 10px;
            max-width: 100%;
            height: auto;
        }
        /* Mensaje final elegante fuera del canvas para que luzca perfecto en móviles */
        #mensaje-final {
            display: none;
            text-align: center;
            margin-top: 20px;
            animation: fadeIn 1.5s ease-in-out forwards;
        }
        #mensaje-final h2 {
            color: #4CC9F0;
            font-size: 28px;
            margin: 0 0 10px 0;
        }
        #mensaje-final p {
            color: #A5C4D4;
            font-size: 16px;
            font-style: italic;
            line-height: 1.5;
            margin: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <canvas id="simulacion" width="750" height="800"></canvas>
    
    <div id="mensaje-final">
        <h2>Te quiero Mary</h2>
        <p>No soy de levantar paredes con cemento y ladrillos;<br>
        pero con líneas de código puedo construirte un universo entero<br>
        solo para verte sonreír. 😊</p>
    </div>
</div>

<script>
const canvas = document.getElementById('simulacion');
const ctx = canvas.getContext('2d');

let dron = { x: 375, y: 350 };
let puntosDibujados = [];

// Definir la casa (Violeta)
let ox = 295, oy = 450, ancho = 160, alto = 120;
let puntosCasa = [];

for (let x = ox; x <= ox + ancho; x += 10) puntosCasa.push({x: x, y: oy, color: '#9D4EDD'});
for (let y = oy; y >= oy - alto; y -= 10) puntosCasa.push({x: ox + ancho, y: y, color: '#9D4EDD'});
for (let i = 0; i <= 8; i++) {
    puntosCasa.push({
        x: (ox + ancho) - (i * (ancho / 2) / 8),
        y: (oy - alto) - (i * 70 / 8),
        color: '#9D4EDD'
    });
}
for (let i = 0; i <= 8; i++) {
    puntosCasa.push({
        x: (ox + ancho / 2) - (i * (ancho / 2) / 8),
        y: (oy - alto - 70) + (i * 70 / 8),
        color: '#9D4EDD'
    });
}
for (let y = oy - alto; y <= oy; y += 10) puntosCasa.push({x: ox, y: y, color: '#9D4EDD'});

let puertaX = ox + 65;
for (let y = oy; y >= oy - 45; y -= 8) puntosCasa.push({x: puertaX, y: y, color: '#9D4EDD'});
for (let x = puertaX; x <= puertaX + 30; x += 8) puntosCasa.push({x: x, y: oy - 45, color: '#9D4EDD'});
for (let y = oy - 45; y <= oy; y += 8) puntosCasa.push({x: puertaX + 30, y: y, color: '#9D4EDD'});

[ox + 25, ox + 115].forEach(vx => {
    let vy = oy - 70;
    for (let y = vy; y >= vy - 25; y -= 8) puntosCasa.push({x: vx, y: y, color: '#9D4EDD'});
    for (let x = vx; x <= vx + 20; x += 8) puntosCasa.push({x: x, y: vy - 25, color: '#9D4EDD'});
    for (let y = vy - 25; y <= vy; y += 8) puntosCasa.push({x: vx + 20, y: y, color: '#9D4EDD'});
    for (let x = vx + 20; x >= vx; x -= 8) puntosCasa.push({x: x, y: vy, color: '#9D4EDD'});
});

// Definir el corazón (Rojo)
let puntosCorazon = [];
for (let t_val = 0; t_val < 63; t_val += 2) {
    let t = t_val / 10.0;
    let hx = Math.round(375 + 16 * (16 * Math.pow(Math.sin(t), 3)));
    let hy = Math.round(320 - 16 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)));
    puntosCorazon.push({x: hx, y: hy, color: '#FF0054'});
}

let colaPuntos = [...puntosCasa, ...puntosCorazon];
let indiceActual = 0;

function animar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    puntosDibujados.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
    });

    if (indiceActual < colaPuntos.length) {
        let destino = colaPuntos[indiceActual];
        
        dron.x += (destino.x - dron.x) * 0.2;
        dron.y += (destino.y - dron.y) * 0.2;

        if (Math.hypot(destino.x - dron.x, destino.y - dron.y) < 1) {
            puntosDibujados.push(destino);
            indiceActual++;
        }

        ctx.beginPath();
        ctx.arc(dron.x, dron.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#4CC9F0';
        ctx.strokeStyle = '#FFFFFF';
        ctx.lineWidth = 2;
        ctx.fill();
        ctx.stroke();

        requestAnimationFrame(animar);
    } else {
        // Mostrar el mensaje HTML fluido y grande abajo en cuanto termine la animación
        document.getElementById('mensaje-final').style.display = 'block';
    }
}

setTimeout(animar, 1000);
</script>

</body>
</html>
